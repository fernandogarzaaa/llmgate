[build-system]
requires = ["hatchling>=1.24,<2"]
build-backend = "hatchling.build"

[project]
name = "llmgate"
dynamic = ["version"]
description = "A production-grade, OpenAI-compatible LLM gateway: multi-provider routing with fallbacks and circuit breakers, guardrails, exact + semantic caching, per-tenant keys, rate limits and budgets, Prometheus metrics and OpenTelemetry tracing."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fernando Garza", email = "fernandogarzaaa@gmail.com" }]
keywords = ["llm", "gateway", "openai", "anthropic", "proxy", "rate-limit", "semantic-cache", "guardrails", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.29,<1",
  "pydantic>=2.5,<3",
  "pyyaml>=6,<7",
  "prometheus-client>=0.19,<1",
  "sqlalchemy>=2.0,<3",
  "numpy>=1.24,<3",
  "opentelemetry-api>=1.20,<2",
]

[project.optional-dependencies]
redis = ["redis>=5,<7"]
postgres = ["psycopg[binary]>=3.1,<4"]
otel = ["opentelemetry-sdk>=1.20,<2", "opentelemetry-exporter-otlp-proto-http>=1.20,<2"]
embeddings = ["fastembed>=0.3,<1"]
# costroute and injectguard (the router and guardrail libraries) are deliberately NOT extras:
# "injectguard" on PyPI is an unrelated third-party package and "costroute" is unclaimed there, so
# an extra would install someone else's code. Install them from their repositories instead
# (see README "Optional integrations").
all = ["llmgate[redis,postgres,otel]"]
dev = [
  "llmgate[redis,otel]",
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "fakeredis[lua]>=2.20,<3",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML>=6",
  "build>=1.2",
  "twine>=5",
]
mutation = ["testteeth>=0.2,<1"]

[project.scripts]
llmgate = "llmgate.cli:main"

[project.urls]
Homepage = "https://github.com/fernandogarzaaa/llmgate"
Repository = "https://github.com/fernandogarzaaa/llmgate"
Changelog = "https://github.com/fernandogarzaaa/llmgate/blob/main/CHANGELOG.md"
Issues = "https://github.com/fernandogarzaaa/llmgate/issues"

[tool.hatch.version]
path = "src/llmgate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/llmgate"]

[tool.hatch.build.targets.sdist]
include = [
  "src/llmgate", "tests", "examples", "deploy", "bench", "README.md", "LICENSE",
  "CHANGELOG.md", "SECURITY.md", "CONTRIBUTING.md", "Makefile", "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "slow: end-to-end tests that start real server processes",
  "redis: needs a real Redis (LLMGATE_TEST_REDIS_URL)",
  "postgres: needs a real Postgres (LLMGATE_TEST_DATABASE_URL)",
]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:.*httpx.*:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "bench/data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B008", "SIM105", "RUF012", "RUF046", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM", "RUF"]
"bench/*" = ["E501", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
files = ["src/llmgate"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["costroute", "costroute.*", "injectguard", "injectguard.*", "fastembed", "fastembed.*", "fakeredis", "redis", "redis.*", "opentelemetry.exporter.*"]
ignore_missing_imports = true

[tool.testteeth]
# Mutation testing of the dependency-light core (https://pypi.org/project/testteeth/).
# The FastAPI glue, providers and CLI are covered by integration tests instead.
paths = [
  "src/llmgate/ratelimit.py",
  "src/llmgate/budget.py",
  "src/llmgate/cost.py",
  "src/llmgate/cache.py",
  "src/llmgate/resilience.py",
  "src/llmgate/routing.py",
]
test_args = ["tests/unit", "-q", "-x", "-p", "no:cacheprovider"]
